<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>삼육대 취업특강</title>
<link rel="preconnect" href="https://gxyckkinlygeasruapmj.supabase.co">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="lv-widget.css">
<style>
:root{--bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--ink:#F5F5F7;--sub:#A1A1A6;--mute:#6E6E73;--acc:#FF9F0A;--line:#3A3A3C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:18px;line-height:1.5;
  letter-spacing:-.01em;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:calc(14px + env(safe-area-inset-top)) 18px 0}
.ttl{font-size:16px;font-weight:600;color:var(--sub);margin-bottom:10px}
nav{display:flex;gap:6px;border-bottom:1px solid var(--card2)}
nav button{flex:1;position:relative;background:none;border:0;padding:12px 0 14px;font-size:18px;font-weight:700;color:var(--mute);cursor:pointer}
nav button[aria-selected=true]{color:var(--ink)}
nav button[aria-selected=true]::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:3px;border-radius:2px;background:var(--acc)}
nav button .dot{display:none;position:absolute;top:10px;margin-left:4px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
nav button.has-new .dot{display:inline-block}
#banner{display:none;margin:12px 18px 0;padding:12px 16px;border-radius:12px;background:var(--card2);color:var(--ink);font-size:16px}
#banner.on{display:block}
main{flex:1;padding:22px 18px 28px;width:100%;max-width:560px;margin:0 auto}
main[hidden]{display:none}
.wait{padding:56px 8px;text-align:center;color:var(--sub);font-size:18px;line-height:1.6;word-break:keep-all}
.wait b{display:block;color:var(--ink);font-size:21px;margin-bottom:6px}
.q{font-size:24px;font-weight:700;line-height:1.4;margin:0 0 20px;word-break:keep-all}
.hint{font-size:15px;color:var(--sub);margin:-10px 0 18px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:14px 18px;border-radius:16px;border:2px solid var(--card2);
  background:var(--card);text-align:left;font-size:19px;font-weight:600;cursor:pointer;word-break:keep-all;transition:border-color .15s,background .15s}
.opt .mk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mute)}
.opt.sel{border-color:var(--acc);background:#2a1d08}
.opt.sel .mk{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 4px #2a1d08}
.opt:disabled{cursor:default}
.opt:disabled:not(.sel){opacity:.45}
textarea,input[type=text]{width:100%;border-radius:16px;border:2px solid var(--card2);background:var(--card);padding:14px 16px;font-size:18px;
  line-height:1.5;outline:none;resize:none;-webkit-appearance:none;appearance:none}
textarea:focus,input[type=text]:focus{border-color:var(--mute)}
textarea{min-height:120px}
.row{display:flex;gap:10px;align-items:stretch}
.row input{flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 14px;font-size:15px;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;padding:0 22px;border-radius:16px;border:0;background:var(--acc);color:#000;
  font-size:19px;font-weight:700;cursor:pointer;width:100%}
.row .btn{width:auto;flex:none}
.btn:disabled{background:var(--card2);color:var(--mute)}
.btn.ghost{background:var(--card2);color:var(--ink)}
.ok{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:18px;font-weight:700;color:var(--acc);min-height:28px}
.err{margin-top:12px;font-size:16px;color:var(--ink);background:var(--card2);padding:10px 14px;border-radius:12px}
.err:empty{display:none}
.mine{margin-top:16px;padding:18px;border-radius:16px;background:var(--card);font-size:19px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:9px 14px;border-radius:999px;background:var(--card2);font-size:17px;font-weight:600}
.res{margin-top:30px;padding-top:22px;border-top:1px solid var(--card2)}
.res h3{margin:0 0 14px;font-size:16px;color:var(--sub);font-weight:600}
.qa-form{margin-bottom:26px}
.qa-list{display:flex;flex-direction:column;gap:12px}
.qa{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--card)}
.qa p{flex:1;margin:0;font-size:18px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.qa .tag{display:block;margin-top:6px;font-size:14px;color:var(--mute)}
.qa.done{opacity:.55}
.like{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px;min-height:56px;padding:6px 8px;border-radius:12px;
  border:2px solid var(--card2);background:none;cursor:pointer;font-size:13px;color:var(--sub);line-height:1.2}
.like b{font-size:20px;color:var(--ink)}
.like.on{border-color:var(--acc);color:var(--acc)}
.like.on b{color:var(--acc)}
.like:disabled:not(.on){opacity:.5}
.empty{color:var(--mute);text-align:center;padding:24px 0;font-size:16px}
footer{padding:16px 18px calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:14px;color:var(--mute)}
.sec-t{font-size:16px;font-weight:600;color:var(--sub);margin:0 0 12px}
</style>
</head>
<body>
<header>
  <div class="ttl" id="ttl">삼육대 취업특강</div>
  <nav role="tablist">
    <button role="tab" id="tab-q" aria-selected="true">지금 질문<span class="dot"></span></button>
    <button role="tab" id="tab-qa" aria-selected="false">Q&amp;A<span class="dot"></span></button>
  </nav>
</header>
<div id="banner" role="status">연결이 끊겼어요. 다시 연결 중…</div>
<main id="pane-q"><div class="wait">불러오는 중…</div></main>
<main id="pane-qa" hidden></main>
<footer>답변은 익명으로 저장되며 강의 후 삭제됩니다</footer>

<script>window.LV_CONFIG = { manual: true };</script>
<script src="lv-widget.js"></script>
<script>
(function () {
  'use strict';
  var LV = window.LV, esc = LV.esc;
  var params = new URLSearchParams(location.search);
  var PREVIEW = params.get('preview') === '1';
  var room = (params.get('r') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '');
  var cid = PREVIEW ? 'preview-0000' : LV.clientId();
  var $ = function (id) { return document.getElementById(id); };
  var paneQ = $('pane-q'), paneQA = $('pane-qa');

  var S = { tab: 'q', room: null, q: null, mine: [], sending: false, editing: false, qa: [], qaLoaded: false, res: null };

  var ERR = {
    closed: '질문이 닫혔어요', slow: '조금 천천히 눌러 주세요', locked: '이 질문은 답을 바꿀 수 없어요', long: '글자 수가 너무 많아요',
    full: '3개까지 보낼 수 있어요', empty: '내용을 입력해 주세요', invalid: '다시 시도해 주세요', net: '보내지 못했어요. 다시 눌러 주세요'
  };

  /* 탭 */
  function setTab(t) {
    S.tab = t;
    $('tab-q').setAttribute('aria-selected', t === 'q'); $('tab-qa').setAttribute('aria-selected', t === 'qa');
    $('tab-' + t).classList.remove('has-new');
    paneQ.hidden = t !== 'q'; paneQA.hidden = t !== 'qa';
    if (t === 'qa') loadQA();
    window.scrollTo(0, 0);
  }
  $('tab-q').onclick = function () { setTab('q'); };
  $('tab-qa').onclick = function () { setTab('qa'); };

  /* 연결 끊김 표시 */
  var offT = null;
  function netBanner(on) { $('banner').classList.toggle('on', on); }
  if (!PREVIEW) LV.onNet(function (n) {
    clearTimeout(offT);
    if (n.rest) netBanner(false);
    else offT = setTimeout(function () { netBanner(!LV.net.rest); }, 2000);
  });

  /* ───────── 지금 질문 ───────── */
  function waitView(msg) {
    paneQ.innerHTML = '<div class="wait">' + msg + '</div>';
  }

  function renderQ() {
    var q = S.q;
    if (!S.room) return;
    if (!q) { S.res = null; waitView('<b>잠시만요</b>강사가 질문을 열면 여기에 나타납니다'); return; }
    var html = '<h1 class="q">' + esc(q.prompt) + '</h1>';
    if (q.type === 'choice') {
      var locked = S.mine.length && !q.allow_change;
      html += '<div class="hint">' + (q.allow_change ? '하나를 고르세요. 다시 누르면 바뀌어요' : '하나를 고르세요. 한 번만 고를 수 있어요') + '</div><div class="opts">';
      (q.options || []).forEach(function (o, i) {
        var sel = S.mine[0] === String(i);
        html += '<button class="opt' + (sel ? ' sel' : '') + '" data-i="' + i + '"' + (locked ? ' disabled' : '') + '><span class="mk"></span><span>' + esc(o) + '</span></button>';
      });
      html += '</div><div class="ok" id="ok">' + (S.mine.length ? '보냈어요 ✓' : '') + '</div>';
    } else if (q.type === 'text') {
      if (S.mine.length && !S.editing) {
        html += '<div class="mine">' + esc(S.mine[0]) + '</div><div class="ok">보냈어요 ✓</div>';
        if (q.allow_change) html += '<button class="btn ghost" id="edit" style="margin-top:12px">고치기</button>';
      } else {
        html += '<textarea id="tx" maxlength="100" rows="4" placeholder="한두 문장으로 써 주세요"></textarea>' +
          '<div class="meta"><span>최대 100자</span><span id="cnt">0/100</span></div><button class="btn" id="send">보내기</button>';
      }
    } else {
      var full = S.mine.length >= 3;
      html += '<div class="hint">짧은 말로, 최대 3개까지 보낼 수 있어요</div>';
      if (!full) html += '<form class="row" id="wf"><input type="text" id="wd" maxlength="10" placeholder="한 단어 (10자까지)" autocomplete="off" enterkeyhint="send"><button class="btn" id="send" type="submit">보내기</button></form>';
      if (S.mine.length) html += '<div class="chips">' + S.mine.map(function (m) { return '<span class="chip">' + esc(m) + '</span>'; }).join('') + '</div>';
      html += '<div class="ok">' + (full ? '3개 모두 보냈어요 ✓' : S.mine.length ? '보냈어요 ✓ (' + S.mine.length + '/3)' : '') + '</div>';
    }
    html += '<div class="err" id="err"></div>';
    if (q.show_results && S.mine.length) html += '<div class="res"><h3>지금까지 결과</h3><div class="lv-box lv-compact" id="res"><div class="lv-body"></div></div></div>';
    paneQ.innerHTML = html;
    bindQ();
    if (q.show_results && S.mine.length) drawRes();
  }

  function bindQ() {
    var q = S.q;
    Array.prototype.forEach.call(paneQ.querySelectorAll('.opt'), function (b) {
      b.onclick = function () {
        var i = b.getAttribute('data-i');
        if (S.mine[0] === i) return;
        Array.prototype.forEach.call(paneQ.querySelectorAll('.opt'), function (x) { x.classList.toggle('sel', x === b); });
        $('ok').textContent = '';
        send([i]);
      };
    });
    var tx = $('tx');
    if (tx) {
      tx.oninput = function () { $('cnt').textContent = tx.value.length + '/100'; };
      if (S.draft) { tx.value = S.draft; tx.oninput(); }
      $('send').onclick = function () { var v = tx.value.trim(); if (!v) return showErr('empty'); S.draft = tx.value; send([v]); };
    }
    if ($('edit')) $('edit').onclick = function () { S.editing = true; S.draft = S.mine[0]; renderQ(); $('tx').focus(); };
    if ($('wf')) $('wf').onsubmit = function (e) {
      e.preventDefault();
      var v = $('wd').value.trim();
      if (!v) return showErr('empty');
      send([v]);
    };
  }

  function showErr(code) { var e = $('err'); if (e) e.textContent = ERR[code] || ERR.invalid; }

  function send(values, retried) {
    if (PREVIEW) { S.mine = S.q.type === 'wordcloud' ? S.mine.concat(values) : values; S.editing = false; renderQ(); return; }
    if (S.sending) return;
    S.sending = true;
    var btn = $('send'); if (btn) btn.disabled = true;
    showErr(''); if ($('err')) $('err').textContent = '';
    var qid = S.q.id;
    LV.rpc('lv_submit', { p_room: room, p_qid: qid, p_cid: cid, p_values: values }).then(function (r) {
      S.sending = false;
      if (!S.q || S.q.id !== qid) return;
      if (r && r.ok) { S.mine = r.mine || values; S.editing = false; S.draft = ''; renderQ(); return; }
      var code = (r && r.err) || 'invalid';
      if (code === 'slow' && !retried) { setTimeout(function () { send(values, true); }, 1100); return; }
      if (r && r.mine) S.mine = r.mine;
      if (code === 'closed') { refreshState(); }
      if (btn) btn.disabled = false;
      if (S.q.type === 'choice') loadMine().then(renderQ).then(function () { showErr(code); }); else showErr(code);
    }, function () {
      S.sending = false; if (btn) btn.disabled = false;
      if (S.q.type === 'choice') Array.prototype.forEach.call(paneQ.querySelectorAll('.opt'), function (x) { x.classList.toggle('sel', S.mine[0] === x.getAttribute('data-i')); });
      showErr('net');
    });
  }

  function loadMine() {
    if (!S.q) return Promise.resolve();
    var qid = S.q.id;
    return LV.rpc('lv_mine', { p_qid: qid, p_cid: cid }).then(function (m) { if (S.q && S.q.id === qid) S.mine = m || []; }, function () {});
  }

  function drawRes() {
    var el = $('res'); if (!el || !S.q) return;
    if (S.res && S.res.id === S.q.id) LV.renderResult(el.querySelector('.lv-body'), S.res, { compact: true });
  }
  var resBusy = false;
  function loadRes() {
    if (PREVIEW || !S.q || !S.q.show_results || !S.mine.length || resBusy) return;
    resBusy = true;
    LV.rpc('lv_results', { p_qid: S.q.id }).then(function (r) { S.res = r; drawRes(); }, function () {}).then(function () { resBusy = false; });
  }
  var loadResSoon = (function () { var t; return function () { clearTimeout(t); t = setTimeout(loadRes, 1200); }; })();

  function applyState(st) {
    if (!st) { waitView('<b>방을 찾을 수 없어요</b>QR 코드를 다시 찍어 주세요'); return; }
    S.room = st.room;
    $('ttl').textContent = st.room.title;
    document.title = st.room.title;
    var nq = st.q || null, oldId = S.q && S.q.id;
    if (!nq) { S.q = null; renderQ(); return; }
    var changed = oldId !== nq.id || JSON.stringify(nq) !== JSON.stringify(S.q);
    if (oldId !== nq.id) {
      S.q = nq; S.mine = []; S.editing = false; S.draft = ''; S.res = null;
      // 새 질문이 열리면 질문 화면으로 (Q&A 쓰는 중이면 점만 표시)
      if (S.tab !== 'q') {
        var qt = $('qa-tx');
        if (qt && qt.value.trim()) $('tab-q').classList.add('has-new'); else setTab('q');
      }
      loadMine().then(function () { renderQ(); loadRes(); });
    } else if (changed) {
      S.q = nq;
      if (!S.editing && !(document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) renderQ();
      loadRes();
    }
  }

  var stBusy = false, stAgain = false;
  function refreshState() {
    if (PREVIEW || !room) return;
    if (stBusy) { stAgain = true; return; }
    stBusy = true;
    LV.rpc('lv_state', { p_room: room }).then(applyState, function () {
      if (!S.room) waitView('<b>연결하는 중…</b>인터넷 연결을 확인해 주세요');
    }).then(function () { stBusy = false; if (stAgain) { stAgain = false; refreshState(); } });
  }

  /* ───────── Q&A ───────── */
  function renderQA() {
    var on = !S.room || S.room.qa_enabled;
    var draft = $('qa-tx') ? $('qa-tx').value : '';
    var focused = document.activeElement && document.activeElement.id === 'qa-tx';
    var html = '';
    if (!on) html += '<div class="wait">지금은 Q&amp;A를 받지 않아요</div>';
    else html += '<form class="qa-form" id="qa-f"><p class="sec-t">궁금한 걸 익명으로 물어보세요</p>' +
      '<textarea id="qa-tx" maxlength="150" rows="3" placeholder="질문을 써 주세요"></textarea>' +
      '<div class="meta"><span>' + (S.room && S.room.qa_moderation ? '강사가 확인한 뒤 모두에게 보여요' : '최대 150자') + '</span><span id="qa-cnt">0/150</span></div>' +
      '<button class="btn" id="qa-send" type="submit">질문 보내기</button><div class="ok" id="qa-ok"></div><div class="err" id="qa-err"></div></form>';
    var list = S.qa;
    if (on || list.length) {
      html += '<p class="sec-t">모두의 질문 ' + list.filter(function (i) { return i.status !== 'pending'; }).length + '</p><div class="qa-list">';
      if (!list.length) html += '<div class="empty">' + (S.qaLoaded ? '아직 질문이 없어요' : '불러오는 중…') + '</div>';
      list.forEach(function (it) {
        var tag = it.status === 'pending' ? '내 질문 · 확인 중' : it.status === 'answered' ? '답변 완료' : it.mine ? '내 질문' : '';
        var canLike = it.status === 'approved' && !it.mine && !it.liked;
        html += '<div class="qa' + (it.status === 'answered' ? ' done' : '') + '"><p>' + esc(it.body) + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</p>' +
          (it.status === 'pending' ? '' : '<button class="like' + (it.liked ? ' on' : '') + '" data-id="' + it.id + '"' + (canLike ? '' : ' disabled') + '><b>' + it.likes + '</b>나도 궁금해</button>') + '</div>';
      });
      html += '</div>';
    }
    paneQA.innerHTML = html;
    var tx = $('qa-tx');
    if (tx) {
      tx.value = draft;
      tx.oninput = function () { $('qa-cnt').textContent = tx.value.length + '/150'; };
      tx.oninput();
      if (focused) tx.focus();
      $('qa-f').onsubmit = function (e) { e.preventDefault(); postQA(); };
    }
    Array.prototype.forEach.call(paneQA.querySelectorAll('.like:not([disabled])'), function (b) {
      b.onclick = function () { like(+b.getAttribute('data-id'), b); };
    });
  }

  function postQA() {
    var tx = $('qa-tx'), v = tx.value.trim();
    $('qa-err').textContent = ''; $('qa-ok').textContent = '';
    if (!v) { $('qa-err').textContent = ERR.empty; return; }
    if (PREVIEW) return;
    $('qa-send').disabled = true;
    LV.rpc('lv_qa_post', { p_room: room, p_cid: cid, p_body: v }).then(function (r) {
      $('qa-send').disabled = false;
      if (r && r.ok) {
        tx.value = ''; tx.oninput();
        $('qa-ok').textContent = S.room && S.room.qa_moderation ? '보냈어요 ✓ 강사가 확인하면 공개돼요' : '보냈어요 ✓';
        loadQA(true);
      } else $('qa-err').textContent = r && r.err === 'slow' ? '질문을 너무 자주 보냈어요. 잠시 뒤에 다시 보내 주세요' : (ERR[r && r.err] || ERR.invalid);
    }, function () { $('qa-send').disabled = false; $('qa-err').textContent = ERR.net; });
  }

  function like(id, b) {
    b.disabled = true; b.classList.add('on');
    var n = b.querySelector('b'); n.textContent = +n.textContent + 1;
    LV.rpc('lv_qa_like', { p_qa: id, p_cid: cid }).then(function (r) {
      if (r && r.ok) { S.qa.forEach(function (i) { if (i.id === id) { i.liked = true; } }); loadQA(true); }
      else if (r && r.err === 'slow') { setTimeout(function () { like(id, b); }, 1100); }
      else loadQA(true);
    }, function () { b.disabled = false; b.classList.remove('on'); n.textContent = +n.textContent - 1; });
  }

  var qaBusy = false;
  function loadQA(force) {
    if (PREVIEW || !room || qaBusy) return;
    if (S.tab !== 'qa' && !force) { S.qaStale = true; return; }
    qaBusy = true;
    LV.rpc('lv_qa_list', { p_room: room, p_cid: cid }).then(function (list) {
      var sig = JSON.stringify(list);
      S.qaLoaded = true;
      if (sig !== S.qaSig || !paneQA.firstChild) { S.qaSig = sig; S.qa = list || []; renderQA(); }
    }, function () { if (!paneQA.firstChild) renderQA(); }).then(function () { qaBusy = false; S.qaStale = false; });
  }
  var loadQASoon = (function () { var t; return function () { clearTimeout(t); t = setTimeout(function () { loadQA(); }, 400 + Math.random() * 600); }; })();

  /* ───────── 시작 ───────── */
  if (PREVIEW) {
    // 관리 화면 미리보기: 부모 창이 보낸 질문을 그린다 (서버에 보내지 않음)
    S.room = { title: '미리보기', qa_enabled: true, qa_moderation: true };
    window.addEventListener('message', function (e) {
      if (!e.data || !e.data.lvPreview) return;
      S.q = e.data.lvPreview.q; S.mine = []; S.editing = false;
      $('ttl').textContent = e.data.lvPreview.title || '미리보기';
      renderQ();
    });
    waitView('<b>잠시만요</b>강사가 질문을 열면 여기에 나타납니다');
    if (window.parent !== window) window.parent.postMessage({ lvPreviewReady: true }, '*');
    return;
  }
  if (!room) { waitView('<b>QR 코드를 다시 찍어 주세요</b>주소에 방 정보가 없어요'); $('tab-qa').disabled = true; return; }

  refreshState();
  LV.rt.sub(room, function (m) {
    if (m.t === 'room' || m.t === 'q' || m.t === 'all' || m.t === 'resync') refreshState();
    if (m.t === 'qa' || m.t === 'room' || m.t === 'all' || m.t === 'resync') loadQASoon();
    if ((m.t === 'r' && S.q && m.q === S.q.id) || m.t === 'resync') loadResSoon();
  });
  // 실시간이 끊긴 동안에는 5초마다, 붙어 있으면 30초마다 상태 확인
  (function loop() {
    setTimeout(function () { refreshState(); if (S.tab === 'qa') loadQA(); loop(); }, LV.net.rt ? 30000 : 5000);
  })();
})();
</script>
</body>
</html>
